apiVersion: skaffold/v4beta1
kind: Config
build:
  googleCloudBuild:
    projectId: crypto-minutia-426422-g1
  artifacts:
    - image: us.gcr.io/crypto-minutia-426422-g1/auth
      context: auth
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: us.gcr.io/crypto-minutia-426422-g1/client
      context: client
      sync:
        manual:
          - src: src/**/*.js
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: us.gcr.io/crypto-minutia-426422-g1/tickets
      context: tickets
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - ./infra/k8s/*
